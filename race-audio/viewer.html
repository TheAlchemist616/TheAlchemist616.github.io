<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Race Audio overlay</title>
<link rel="stylesheet" href="viewer.css">
<style>:root { color-scheme: dark; }</style>
</head>
<body>
<div id="app" hidden>
  <div id="zones"></div>
  <button id="mixer-toggle" class="chip" type="button" aria-expanded="false" aria-controls="panel"></button>
  <div id="panel" role="dialog" aria-label="Audio mixer" hidden></div>
  <div id="hint" role="status" hidden>Mute the Twitch player so you only hear your picks.</div>
</div>
<script src="shim.js"></script>
<script src="common.js"></script>
<script src="player.js"></script>
<script src="viewer.js"></script>
</body>
</html>
